{% extends 'products/base.html' %}
{% load static %}

{% block css %}
<link href="{% static 'css/products.css' %}" rel="stylesheet">
<link href="{% static 'css/mobile.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<br>
<div class="container">

    <div class="row">

        <div class="col-lg-3">

            <h1 class="my-4">Интернет магазин косметики</h1>
            <div class="list-group">
                {% for category in categories %}
                <a href="{% url 'products:products1' category.id %}" class="list-group-item">
                    {{ category.name }}
                </a>

                <!-- <p><a href="{% url 'products:products1' category.id %}" class="list-group-item">bnbm</a></p> -->
                {% endfor %}

            </div>

        </div>
        <!-- /.col-lg-3 -->

        <div class="col-lg-9">

            <div id="carouselExampleIndicators" class="carousel slide my-4" data-ride="carousel">
                <ol class="carousel-indicators">
                    <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                    <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                    <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
                </ol>
                <div class="carousel-inner" role="listbox">
                    <div class="carousel-item">
                        <video width="640px" height="360px" controls src="/static/img/products/Difusor MOV.MOV"
                            type="video/MOV" autoplay muted alt="Second slide">
                        </video>
                    </div>
                    <div class="carousel-item">
                        <video width="640px" height="360px" controls src="/static/img/products/IMG_9609.MP4"
                            type="video/mp4" autoplay muted alt="Second slide">
                        </video>
                    </div>
                    <div class="carousel-item">
                        <video width="640px" height="360px" controls src="/static/img/products/IMG_9610.MP4"
                            type="video/mp4" autoplay muted alt="Second slide">
                        </video>
                    </div>
                    <div class="carousel-item active">
                        <img class="d-block img-fluid" width="640px" height="360px"
                            src="/static/img/products/IMG_2821.JPG" alt="First slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block img-fluid" width="640px" height="360px"
                            src="/static/img/products/IMG_2848.JPG" alt="Second slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block img-fluid" width="640px" height="360px"
                            src="/static/img/products/IMG_2823.JPG" alt="Second slide">
                    </div>
                    <div class="carousel-item">
                        <img class="d-block img-fluid" width="640px" height="360px"
                            src="/static/img/products/IMG_2827.JPG" alt="Second slide">
                    </div>

                </div>
                <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>

            <div class="row">

            </div>



        </div>

    </div>

</div>
{% endblock %}


{% block footer %}
{% include 'products/footers.html' %}
{% endblock %}
