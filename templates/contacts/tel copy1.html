{% extends 'products/base.html' %}

{% block content %}

<div class="container mt-5">

<h2>Наши контакты</h2>

{% if messages %}
    {% for message in messages %}
        <div class="alert alert-success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-success">
        Отправить
    </button>

</form>

</div>

{% endblock %}
